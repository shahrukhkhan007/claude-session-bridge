# Tooling config only — this project has no runtime dependencies.

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]  # long lines are fine in help text / log strings

[tool.bandit]
# B112 (try/except/continue) is used intentionally to skip unreadable/corrupt
# files; CI gates on medium+ severity so these low findings don't fail builds.
skips = ["B112"]
